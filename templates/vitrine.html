<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitrine</title>

<link rel="stylesheet" href="{{ static_asset('style.css') }}">

<style>
body.admin-has-sidebar .vitrine-container {
  max-width: none;
  margin-left: 270px;
  margin-right: 24px;
  padding: 0 16px;
}

.vitrine-container {
  max-width: none;
  margin: 30px 16px;
  padding: 0;
}

.vitrine-filter-box {
  display: grid;
  grid-template-columns:
    repeat(3, minmax(180px, 1fr))
    auto;
  gap: 12px;
  margin-bottom: 20px;
  padding: 16px;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
}

.vitrine-filter-box select,
.vitrine-filter-box button {
  width: 100%;
  min-height: 44px;
  padding: 11px 13px;
  border-radius: 11px;
  font-size: 14px;
  box-sizing: border-box;
}

.vitrine-filter-box select {
  border: 1px solid #d1d5db;
  background: #ffffff;
}

.vitrine-filter-box button {
  border: none;
  background: #2563eb;
  color: #ffffff;
  font-weight: 700;
  cursor: pointer;
}

.floating-filter-btn {
  display: none;
}

.filter-panel-header {
  display: none;
}

.filter-overlay {
  display: none;
}

.vitrine-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

.vitrine-item {
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  cursor: pointer;
  
  text-decoration: none;
  color: inherit;
  display: block;
  
  transition: transform 0.2s;

  content-visibility: auto;
  contain-intrinsic-size: 220px 260px;
}

.vitrine-item:hover {
  transform: scale(1.03);
}

.vitrine-item img {
  width: 100%;
  height: 200px;
  object-fit: contain;
  display: block;
  background: #fff;
  aspect-ratio: 1 / 1;
}

.vitrine-caption {
  padding: 10px;
  font-size: 13px;
  text-align: center;
}

.vitrine-title {
  font-weight: bold;
  margin-bottom: 4px;
  color: #111;
}

.vitrine-phone {
  color: #2563eb;
  margin-bottom: 4px;
}

.vitrine-address {
  color: #555;
  font-size: 12px;
}

/* TOPBAR IGUAL SEARCH */


@media (max-width: 768px) {
  body.admin-has-sidebar .vitrine-container,
  .vitrine-container {
    max-width: 100%;
    margin-left: auto;
    margin-right: auto;
    margin-top: 20px;
    margin-bottom: 20px;
    padding: 0 16px;
  }

  .vitrine-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .vitrine-item {
	  border-radius: 8px;
	  box-shadow: none;
	  overflow: hidden;
	}
	
	.floating-filter-btn {
	  position: fixed;
	  right: 14px;
	  top: 45%;
	  z-index: 1100;

	  width: 50px;
	  height: 50px;

	  display: flex;
	  align-items: center;
	  justify-content: center;

	  border: none;
	  border-radius: 50%;

	  background: #2563eb;
	  color: #ffffff;

	  box-shadow: 0 5px 18px rgba(0, 0, 0, 0.28);
	  cursor: pointer;
	}

	.floating-filter-btn svg {
	  width: 24px;
	  height: 24px;

	  fill: none;
	  stroke: currentColor;
	  stroke-width: 2;
	  stroke-linecap: round;
	  stroke-linejoin: round;
	}

	.filter-overlay {
	  position: fixed;
	  inset: 0;
	  z-index: 1150;

	  display: block;

	  background: rgba(0, 0, 0, 0.38);

	  opacity: 0;
	  visibility: hidden;
	  pointer-events: none;

	  transition:
		opacity 0.25s ease,
		visibility 0.25s ease;
	}

	.filter-overlay.open {
	  opacity: 1;
	  visibility: visible;
	  pointer-events: auto;
	}

	.vitrine-filter-box.filter-panel {
	  position: fixed;
	  top: 0;
	  right: 0;
	  bottom: 0;

	  z-index: 1200;

	  width: min(84vw, 340px);
	  height: 100vh;

	  display: flex;
	  flex-direction: column;
	  gap: 14px;

	  margin: 0;
	  padding: 22px 18px;

	  background: #ffffff;
	  border: none;
	  border-radius: 18px 0 0 18px;

	  box-shadow: -6px 0 24px rgba(0, 0, 0, 0.22);

	  transform: translateX(105%);
	  transition: transform 0.25s ease;

	  box-sizing: border-box;
	}

	.vitrine-filter-box.filter-panel.open {
	  transform: translateX(0);
	}

	.filter-panel-header {
	  display: flex;
	  align-items: center;
	  justify-content: space-between;

	  margin-bottom: 8px;
	  font-size: 18px;
	}

	.filter-close-btn {
	  width: 38px !important;
	  min-height: 38px !important;
	  padding: 0 !important;

	  display: flex;
	  align-items: center;
	  justify-content: center;

	  border: none !important;
	  border-radius: 50% !important;

	  background: #f1f5f9 !important;
	  color: #111827 !important;

	  font-size: 27px !important;
	  font-weight: 400 !important;
	  line-height: 1;

	  cursor: pointer;
	}

	.vitrine-filter-box.filter-panel select,
	.vitrine-filter-box.filter-panel > #vitrineFilterBtn {
	  width: 100%;
	  min-height: 48px;
	}

	.vitrine-filter-box.filter-panel > #vitrineFilterBtn {
	  margin-top: 4px;
	}

	/* IMAGEM MENOR */
	.vitrine-item img {
	  width: 100%;
	  height: 120px; /* ↓ menor */
	  object-fit: contain;
	  display: block;
	  background: #fff;
	}

	/* LEGENDA MAIS COMPACTA */
	.vitrine-caption {
	  display: block;
	  padding: 6px; /* ↓ menos espaço */
	  font-size: 11px;
	  text-align: center;
	  line-height: 1.2;
	}

	/* TÍTULO MAIS COMPACTO */
	.vitrine-title {
	  font-weight: bold;
	  margin-bottom: 2px;
	  font-size: 11px;
	  line-height: 1.2;
	}

	/* TELEFONE */
	.vitrine-phone {
	  margin-bottom: 2px;
	  font-size: 10px;
	  line-height: 1.2;
	}

	/* ENDEREÇO */
	.vitrine-address {
	  font-size: 10px;
	  line-height: 1.2;
	}
}
</style>

</head>

<body>

{% include "partials/topbar.html" %}
{% include "partials/admin_sidebar.html" %}

<div class="vitrine-container">
  <h2>Vitrine</h2>

	<button
	  type="button"
	  id="vitrineFloatingFilterBtn"
	  class="floating-filter-btn"
	  aria-label="Abrir filtros"
	  aria-expanded="false"
	>
	  <svg
		viewBox="0 0 24 24"
		aria-hidden="true"
	  >
		<path d="M4 5h16"></path>
		<path d="M7 12h10"></path>
		<path d="M10 19h4"></path>
	  </svg>
	</button>

	<div
	  id="vitrineFilterOverlay"
	  class="filter-overlay"
	></div>

	<div
	  id="vitrineFilterPanel"
	  class="vitrine-filter-box filter-panel"
	>
	  <div class="filter-panel-header">
		<strong>Filtrar por região</strong>

		<button
		  type="button"
		  id="vitrineCloseFilterBtn"
		  class="filter-close-btn"
		  aria-label="Fechar filtros"
		>
		  ×
		</button>
	  </div>

	  <select id="vitrineState">
		<option value="">Todos os estados</option>
	  </select>

	  <select id="vitrineCity">
		<option value="">Todas as cidades</option>
	  </select>

	  <select id="vitrineNeighborhood">
		<option value="">Todos os bairros</option>
	  </select>

	  <button
		type="button"
		id="vitrineFilterBtn"
	  >
		Aplicar filtro
	  </button>
	</div>

  <div
    id="vitrineGrid"
    class="vitrine-grid"
  </div>
</div>

<script src="{{ static_asset('common_layout.js') }}"></script>
<script src="{{ static_asset('vitrine.js') }}"></script>

</body>
</html>
